name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The full Catch2 suite. This is the fast signal: it compiles and the
  # behaviour is right.
  #
  # Built in an Ubuntu 24.04 container rather than on the runner itself. The
  # self-hosted pool is a set of Docker hosts, so a container is the one thing
  # every runner here is known to provide -- and it pins the toolchain, so this
  # job tests a compiler we named rather than whatever the runner happens to
  # carry.
  tests:
    name: tests ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        # A pull request runs one architecture; merges run both. A job-level
        # `if` cannot see the matrix context, so the event picks the matrix.
        # x86_64 goes to the self-hosted pool; there is no self-hosted arm64,
        # so that stays on a GitHub-hosted runner.
        include: >-
          ${{ github.event_name == 'pull_request'
          && fromJSON('[{"runner":"wsjtxcli-runner","arch":"x86_64"}]')
          || fromJSON('[{"runner":"wsjtxcli-runner","arch":"x86_64"},{"runner":"ubuntu-24.04-arm","arch":"arm64"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Build, test and smoke in a container
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            ubuntu:24.04 bash -ex -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -q
              apt-get install -y --no-install-recommends build-essential cmake ca-certificates
              make test
              ./tools/smoke.sh binaries/test/wsjtxcli
              # The container runs as root, so anything it leaves in the
              # workspace is root-owned. On a self-hosted runner the workspace
              # outlives the job, and the next checkout -- which runs as the
              # runner user -- cannot clean files it does not own.
              chown -R "$HOST_UID:$HOST_GID" binaries/ build/
            '

  # macOS is built and tested natively -- Apple's SDK cannot run in a Linux
  # container, so the runner itself is the build host. A pull request runs
  # Apple silicon alone; merges run both architectures.
  macos:
    name: tests macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ github.event_name == 'pull_request'
          && fromJSON('[{"runner":"macos-14","arch":"arm64"}]')
          || fromJSON('[{"runner":"macos-14","arch":"arm64"},{"runner":"macos-15-intel","arch":"x86_64"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Build and test
        run: make test

      - name: Smoke the binary against a fake wsjtx
        run: ./tools/smoke.sh binaries/test/wsjtxcli

  # The artifact users actually download, built against Ubuntu 22.04's glibc so
  # it stays forward compatible with newer distributions, with libstdc++ linked
  # statically so it does not need the build machine's GCC runtime.
  portable:
    name: portable binary ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ github.event_name == 'pull_request'
          && fromJSON('[{"runner":"wsjtxcli-runner","arch":"x86_64"}]')
          || fromJSON('[{"runner":"wsjtxcli-runner","arch":"x86_64"},{"runner":"ubuntu-24.04-arm","arch":"arm64"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Build in the Ubuntu 22.04 baseline
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            ubuntu:22.04 bash -ex -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -q
              apt-get install -y --no-install-recommends build-essential cmake ca-certificates
              cmake -S . -B build/release \
                -DCMAKE_BUILD_TYPE=Release \
                -DWSJTXCLI_BUILD_TESTS=ON \
                -DWSJTXCLI_STATIC_RUNTIME=ON \
                -DWSJTXCLI_BIN_DIR=/work/dist
              cmake --build build/release -j "$(nproc)"
              (cd build/release && ctest --output-on-failure)
              # The container runs as root, so dist/ lands root-owned on the
              # mounted host tree; later steps run as the runner user.
              chown -R "$HOST_UID:$HOST_GID" dist/ build/
            '

      - name: Confirm the binary needs nothing but libc
        run: |
          ldd dist/wsjtxcli
          ! ldd dist/wsjtxcli | grep -q libstdc++

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: wsjtxcli-linux-${{ matrix.arch }}
          path: dist/wsjtxcli

  # The portability claim is "one binary per architecture, no packages to
  # install". This is where it is proven: the exact artifact the previous job
  # produced is dropped into stock distribution images with nothing installed,
  # and has to launch a fake wsjtx and clean up after it.
  distros:
    name: smoke · ${{ matrix.name }}
    needs: portable
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ github.event_name == 'pull_request'
          && fromJSON('[{"name":"ubuntu 24.04","image":"ubuntu:24.04","runner":"wsjtxcli-runner","arch":"x86_64"}]')
          || fromJSON('[
          {"name":"ubuntu 22.04","image":"ubuntu:22.04","runner":"wsjtxcli-runner","arch":"x86_64"},
          {"name":"ubuntu 24.04","image":"ubuntu:24.04","runner":"wsjtxcli-runner","arch":"x86_64"},
          {"name":"debian bookworm","image":"debian:bookworm-slim","runner":"wsjtxcli-runner","arch":"x86_64"},
          {"name":"debian trixie","image":"debian:trixie-slim","runner":"wsjtxcli-runner","arch":"x86_64"},
          {"name":"arch","image":"archlinux:latest","runner":"wsjtxcli-runner","arch":"x86_64"},
          {"name":"ubuntu 24.04 arm64","image":"ubuntu:24.04","runner":"ubuntu-24.04-arm","arch":"arm64"},
          {"name":"debian bookworm arm64","image":"debian:bookworm-slim","runner":"ubuntu-24.04-arm","arch":"arm64"},
          {"name":"raspberry pi os","image":"dtcooper/raspberrypi-os:bookworm","runner":"ubuntu-24.04-arm","arch":"arm64"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: wsjtxcli-linux-${{ matrix.arch }}
          path: dist

      - name: Launch a fake wsjtx on a stock image
        run: |
          chmod +x dist/wsjtxcli
          docker run --rm -v "$PWD:/work:ro" -w /work ${{ matrix.image }} \
            sh -ec './tools/smoke.sh /work/dist/wsjtxcli'
