name: Release artifacts

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

# Two downloads per Linux architecture: a .deb for Debian and Ubuntu, which
# pulls in wsjtx and xvfb, and a bare binary for everyone else. Neither is tied
# to a distribution -- libstdc++ is linked statically, so the only requirement
# is glibc, and the baseline is Ubuntu 22.04's. macOS gets one universal binary
# carrying both slices.

jobs:
  macos:
    name: macOS universal
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Resolve version
        id: version
        run: |
          # On a release the ref is the tag; a manual run has no tag to read.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test
        run: |
          make test
          make build-mac-universal \
            CMAKE_FLAGS="-DCMAKE_BUILD_TYPE=Release -DWSJTXCLI_VERSION=${{ steps.version.outputs.version }}"

      - name: Verify both slices are present and the binary runs
        run: |
          BIN=binaries/macos-universal/wsjtxcli
          lipo -archs "$BIN" | tee /tmp/archs
          grep -q arm64 /tmp/archs && grep -q x86_64 /tmp/archs
          ./tools/smoke.sh "$BIN"

      - name: Name the assets
        run: |
          V="${{ steps.version.outputs.version }}"
          cd binaries/macos-universal
          cp wsjtxcli "wsjtxcli-macos-$V"
          cp wsjtxcli "wsjtxcli-macos-latest"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3
        if: github.event_name == 'release'
        with:
          files: binaries/macos-universal/wsjtxcli-macos-*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: wsjtxcli-macos-universal
          path: binaries/macos-universal/wsjtxcli-macos-*

  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub-hosted on purpose, unlike the build workflow: this job
          # produces a published artifact and holds contents: write. The
          # self-hosted pool also executes pull request code and reaches the
          # host Docker daemon, which is not a machine a release should be cut
          # on -- and releases are too rare for the minutes to matter.
          - runner: ubuntu-24.04
            arch: x86_64
            deb_arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Resolve version
        id: version
        run: |
          # On a release the ref is the tag; a manual run has no tag to read.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build in the Ubuntu 22.04 baseline
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e VERSION="${{ steps.version.outputs.version }}" \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            ubuntu:22.04 bash -ex -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -q
              apt-get install -y --no-install-recommends build-essential cmake ca-certificates
              cmake -S . -B build/release \
                -DCMAKE_BUILD_TYPE=Release \
                -DWSJTXCLI_BUILD_TESTS=ON \
                -DWSJTXCLI_STATIC_RUNTIME=ON \
                -DWSJTXCLI_VERSION="$VERSION" \
                -DWSJTXCLI_BIN_DIR=/work/dist
              cmake --build build/release -j "$(nproc)"
              (cd build/release && ctest --output-on-failure)
              # The container runs as root, so dist/ lands root-owned on the
              # mounted host tree; later steps run as the runner user and add
              # the named assets to that same directory.
              chown -R "$HOST_UID:$HOST_GID" dist/ build/
            '

      - name: Confirm the binary needs nothing but libc
        run: |
          ldd dist/wsjtxcli
          ! ldd dist/wsjtxcli | grep -q libstdc++

      - name: Smoke the release binary
        run: ./tools/smoke.sh dist/wsjtxcli

      - name: Build the .deb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends ruby ruby-dev build-essential
          sudo gem install --no-document fpm
          mkdir -p pkgroot/usr/bin pkgroot/usr/share/doc/wsjtxcli
          install -m 0755 dist/wsjtxcli pkgroot/usr/bin/wsjtxcli
          # CLI11 is compiled in, and its licence asks for its notice to travel
          # with any binary distribution.
          install -m 0644 LICENSE pkgroot/usr/share/doc/wsjtxcli/copyright
          install -m 0644 THIRD-PARTY-NOTICES.md pkgroot/usr/share/doc/wsjtxcli/
          # The glibc floor comes from the binary itself rather than from a
          # number typed here, so it tracks whatever baseline it was built in.
          GLIBC=$(objdump -T dist/wsjtxcli | sed -n 's/.*GLIBC_\([0-9][0-9.]*\).*/\1/p' | sort -V | tail -1)
          test -n "$GLIBC"
          echo "built against glibc $GLIBC"
          fpm -s dir -t deb \
            -n wsjtxcli \
            -v "${{ steps.version.outputs.version }}" \
            --description "Launch isolated, receive-only WSJT-X instances from the command line" \
            --url "https://github.com/ivica3730k/wsjtxcli" \
            --license MIT \
            --maintainer "Ivica <ivica3730k@users.noreply.github.com>" \
            --depends "libc6 (>= $GLIBC)" \
            --depends wsjtx \
            --depends xvfb \
            --architecture ${{ matrix.deb_arch }} \
            -p "dist/wsjtxcli_${{ steps.version.outputs.version }}_${{ matrix.deb_arch }}.deb" \
            -C pkgroot \
            usr

      - name: Confirm the package declares its dependencies and runs
        # Installed without pulling wsjtx and xvfb in: the point is the package
        # layout and the metadata, not a working radio on a CI runner.
        run: |
          DEB="dist/wsjtxcli_${{ steps.version.outputs.version }}_${{ matrix.deb_arch }}.deb"
          dpkg-deb -f "$DEB" Depends | grep -q wsjtx
          dpkg-deb -f "$DEB" Depends | grep -q xvfb
          dpkg-deb -f "$DEB" Depends | grep -q 'libc6 (>= '
          dpkg-deb -c "$DEB" | grep -q usr/share/doc/wsjtxcli/THIRD-PARTY-NOTICES.md
          sudo dpkg -i --force-depends "$DEB"
          /usr/bin/wsjtxcli --version

      - name: Name the assets
        run: |
          V="${{ steps.version.outputs.version }}"
          cp dist/wsjtxcli "dist/wsjtxcli-linux-${{ matrix.arch }}-$V"
          cp dist/wsjtxcli "dist/wsjtxcli-linux-${{ matrix.arch }}-latest"
          # The standalone downloads carry the same notices the package does.
          cp THIRD-PARTY-NOTICES.md LICENSE dist/

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3
        if: github.event_name == 'release'
        with:
          files: |
            dist/wsjtxcli-linux-${{ matrix.arch }}-*
            dist/*.deb
            dist/THIRD-PARTY-NOTICES.md
            dist/LICENSE

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: wsjtxcli-linux-${{ matrix.arch }}
          path: |
            dist/wsjtxcli-linux-${{ matrix.arch }}-*
            dist/*.deb
